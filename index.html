<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 하루</title>
<meta name="theme-color" content="#F2F3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="우리 하루">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손 엄지 영역 중심 — 상단은 읽기, 하단(탭바·추가 버튼)은 조작. 넓은 화면에서는 2단/주간 7열로 펼침 */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#E8EAF1; --ink:#1A1D29; --muted:#5B6176; --line:#D8DBE5;
  --a:#2860A8; --a-soft:#E2ECF8; --b:#BE3A5C; --b-soft:#F8E3E9; --both:#6A4CC0; --both-soft:#ECE6FA;
  --ok:#2C7A4B; --ok-soft:#E1F1E7; --warn:#A35F00; --warn-soft:#FBEFD9;
  --shadow:0 1px 2px rgba(26,29,41,.06),0 6px 20px rgba(26,29,41,.06);
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:16px; --tap:48px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141B; --surface:#1B1E28; --surface2:#262A37; --ink:#ECEEF5; --muted:#A3A9BD; --line:#313646;
  --a:#7DB0F0; --a-soft:#1E2D44; --b:#F28AA4; --b-soft:#3B2130; --both:#B29BF7; --both-soft:#2D2546;
  --ok:#6FCB94; --ok-soft:#1C3527; --warn:#F2B35A; --warn-soft:#3A2C14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141B; --surface:#1B1E28; --surface2:#262A37; --ink:#ECEEF5; --muted:#A3A9BD; --line:#313646;
  --a:#7DB0F0; --a-soft:#1E2D44; --b:#F28AA4; --b-soft:#3B2130; --both:#B29BF7; --both-soft:#2D2546;
  --ok:#6FCB94; --ok-soft:#1C3527; --warn:#F2B35A; --warn-soft:#3A2C14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--both);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:16px;height:16px}

/* ---------- 상단 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.top-spacer{flex:1}
.couple{display:flex;align-items:center;gap:6px;min-height:var(--tap);padding:4px 12px 4px 6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--surface2);border:2px solid var(--surface)}
.ava.a{background:var(--a-soft)} .ava.b{background:var(--b-soft)}
.ava + .ava{margin-left:-12px}
.demo-bar{max-width:1120px;margin:0 auto 4px;padding:0 16px}
.demo-bar > div{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.demo-bar button{font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px}

/* ---------- 본문 */
main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:8px calc(150px + env(safe-area-inset-bottom,0px))}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.big-date{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.h2{font-size:17px;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.h2 .count{font-size:13px;font-weight:600;color:var(--muted)}
.grid-2{display:grid;gap:16px}
@media (min-width:960px){
  .today-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* 카드 */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:12px}
.next-card{padding:18px;display:grid;gap:6px;border:2px solid var(--ink)}
.next-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.next-label .rel{margin-left:auto;font-size:13px;color:var(--ink);background:var(--surface2);padding:3px 10px;border-radius:999px}
.next-title{font-size:21px;font-weight:700;line-height:1.3}
.next-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--muted);font-size:14px}
.together-card{background:var(--both-soft);box-shadow:none}
.together-card .h3{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--both);font-size:15px;margin-bottom:8px}
.tg-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--both) 20%,transparent);width:100%;text-align:left;min-height:var(--tap)}
.tg-item:first-of-type{border-top:0}
.tg-time{font-weight:700;min-width:52px}
.tg-title{font-weight:600;flex:1;min-width:0}
.empty{color:var(--muted);font-size:15px;padding:8px 0}
.empty .link{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:var(--tap)}

/* 뱃지 */
.who{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 6px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.who.a{background:var(--a-soft);color:var(--a)}
.who.b{background:var(--b-soft);color:var(--b)}
.who.both{background:var(--both-soft);color:var(--both)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--surface2);color:var(--muted)}
.pill.dday{background:var(--ink);color:var(--bg)}

/* 타임라인 */
.timeline{display:grid;gap:8px}
.row{display:grid;grid-template-columns:58px 4px minmax(0,1fr) var(--tap);align-items:stretch;gap:0 12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 8px 12px 14px}
.row-time{font-weight:700;font-size:15px;line-height:1.3;padding-top:2px}
.row-time small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.row-bar{border-radius:4px;background:var(--line)}
.row-bar.a{background:var(--a)} .row-bar.b{background:var(--b)}
.row-bar.both{background:repeating-linear-gradient(180deg,var(--a) 0 6px,var(--b) 6px 12px)}
.row-main{text-align:left;min-width:0;display:grid;gap:4px;padding:0}
.row-title{font-weight:600;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.row.done .row-title{text-decoration:line-through;color:var(--muted)}
.row.done{opacity:.75}
.check{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;align-self:center;border:2px solid var(--line);color:transparent;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check.ro{border-style:dashed;color:var(--muted);cursor:default}
.check .icon{width:22px;height:22px;stroke-width:2.6}
.check.ro .icon{width:18px;height:18px;stroke-width:2}
.day-label{font-weight:700;font-size:15px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.day-label.today::after{content:"오늘";font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--bg)}

/* 분할 버튼·칩 */
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;padding:0 16px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 주간 띠 */
.week-nav{display:flex;align-items:center;gap:4px;margin:12px 0}
.week-nav .arrow{width:40px;height:56px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.week-strip{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wday{min-height:60px;border-radius:12px;display:grid;place-items:center;align-content:center;gap:0;font-size:12px;color:var(--muted);font-weight:600;position:relative}
.wday b{font-size:17px;color:var(--ink)}
.wday[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wday[aria-pressed="true"] b{color:var(--bg)}
.wday.is-today:not([aria-pressed="true"]) b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.dots{display:flex;gap:3px;height:6px;margin-top:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.a{background:var(--a)} .dots i.b{background:var(--b)} .dots i.both{background:var(--both)}
@media (min-width:960px){
  .week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
  .week-grid .day-label{margin-top:4px}
  .week-grid .row{grid-template-columns:4px minmax(0,1fr);padding:10px}
  .week-grid .row-time{display:none}
  .week-grid .row .check{display:none}
  .week-grid .row-title::before{content:attr(data-time) " ";color:var(--muted);font-weight:700;font-size:13px}
}

/* 계획 */
.plan{display:grid;gap:10px}
.plan-top{display:flex;gap:12px;align-items:flex-start}
.plan-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--both-soft);flex:none}
.plan-body{flex:1;min-width:0;display:grid;gap:4px}
.plan-title{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.plan-meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:14px}
.plan-actions{display:flex;gap:8px}
.plan-actions .btn{flex:1}

/* 목표 */
.goal{display:grid;gap:14px}
.goal-head{display:flex;gap:12px;align-items:flex-start}
.goal-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--surface2);flex:none}
.goal-title{font-weight:700;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.goal-sub{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px}
.dday-box{margin-left:auto;text-align:right;flex:none}
.dday-box b{display:block;font-family:var(--f-display);font-size:26px;line-height:1}
.dday-box span{font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:118px}
.bar{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;font-size:12px;gap:3px}
.bar .v{font-weight:700;color:var(--ink);min-height:16px}
.bar .track{display:flex;align-items:flex-end;background:var(--surface2);border-radius:8px;overflow:hidden}
.bar .fill{width:100%;background:var(--fillc,var(--ink));border-radius:8px 8px 0 0;min-height:0}
.bar .d{color:var(--muted);font-weight:600}
.bar.today .d{color:var(--ink);font-weight:800}
.progress{display:grid;gap:6px}
.progress-line{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);gap:8px}
.progress-line b{color:var(--ink);font-size:16px}
.meter{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--fillc,var(--ink))}
.weeks4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.weeks4 div{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.weeks4 b{display:block;color:var(--ink);font-size:15px}
.weeks4 .cur{background:var(--ink);color:var(--bg)}
.weeks4 .cur b{color:var(--bg)}

/* 버튼 */
.btn{min-height:var(--tap);padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.both{background:var(--both);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--b);border:1.5px solid color-mix(in srgb,var(--b) 40%,transparent)}
.btn.danger.armed{background:var(--b);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}

/* 하단 탭 + FAB */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{position:relative;min-height:56px;border-radius:14px;display:grid;place-items:center;align-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab .icon{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface2)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--b);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 560px + 16px));bottom:calc(92px + env(safe-area-inset-bottom,0px));height:60px;padding:0 22px 0 18px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab .icon{width:24px;height:24px;stroke-width:2.6}

/* 시트 */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:24px;max-height:86%}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet-head h2{font-size:20px;flex:1}
.x{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field > label,.field > .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.input{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
.input:focus{border-color:var(--ink);outline:none}
textarea.input{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scope{display:grid;gap:8px}
.scope button{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
.scope button b{display:block;font-size:15px}
.scope button span{display:block;font-size:13px;color:var(--muted)}
.scope button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.scope button[aria-pressed="true"] .ring{background:var(--ink);border-color:var(--ink)}
.ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-left:auto;display:grid;place-items:center}
.ring::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface)}
.scope .s-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.s-ico.private{background:var(--surface2)} .s-ico.shared{background:var(--a-soft);color:var(--a)} .s-ico.together{background:var(--both-soft);color:var(--both)}
.detail{display:grid;gap:12px}
.detail-row{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.detail-row .icon{margin-top:3px;color:var(--muted)}
.note{padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.emoji-pick{display:flex;flex-wrap:wrap;gap:8px}
.emoji-pick button{width:52px;height:52px;border-radius:14px;font-size:26px;background:var(--bg);border:2px solid var(--line)}
.emoji-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.switch{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);width:100%;text-align:left}
.switch .t{flex:1}
.switch .t b{display:block;font-size:15px}
.switch .t span{font-size:13px;color:var(--muted)}
.knob{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"] .knob{background:var(--ok)}
.switch[aria-checked="true"] .knob::after{transform:translateX(22px)}
.quick{display:flex;gap:8px;flex-wrap:wrap}

/* 시작 화면 */
.start{min-height:100%;display:grid;place-items:center;padding:32px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.start-in{width:100%;max-width:420px;display:grid;gap:20px}
.start-logo{display:flex;align-items:center;gap:0}
.start-logo .ava{width:56px;height:56px;font-size:28px;border-width:3px;border-color:var(--bg)}
.start-logo .ava + .ava{margin-left:-16px}

.code-input{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.code-input input{text-align:center;font-size:28px;font-weight:700;min-height:68px;padding:0;border-radius:16px;border:2px solid var(--line);background:var(--surface);width:100%}
.code-input input:focus{border-color:var(--ink);outline:none}
.slot-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left;font-weight:700;font-size:17px}
.slot-btn .ava{width:44px;height:44px;font-size:22px}
.slot-btn span{flex:1}
.err{color:var(--b);font-weight:600;font-size:14px;min-height:20px}
.small{font-size:13px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.code-show{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:.2em;text-align:center;padding:8px 0}
.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center;animation:up .2s ease}
.swipe-area{touch-action:pan-y}
.slide-l{animation:slideL .22s ease}.slide-r{animation:slideR .22s ease}
@keyframes slideL{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
.swipe-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);margin:14px 0 0}
@media (display-mode: standalone){body{overscroll-behavior-y:none}}

/* 우리 둘 (함께한 날·한마디) */
.hero{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;margin-bottom:12px}
.hero-top{display:flex;align-items:center;gap:12px}
.hero-avas{display:flex;flex:none}
.hero-avas .ava{width:48px;height:48px;font-size:26px;border-width:3px}
.hero-avas .ava + .ava{margin-left:-14px}
.hero-count{display:grid;min-width:0}
.hero-count b{font-family:var(--f-display);font-size:22px;line-height:1.25;letter-spacing:-.01em}
.anniv-line{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:var(--tap);padding:8px 12px;border-radius:12px;background:var(--surface2);text-align:left;font-size:14px}
.anniv-line > span:first-child{min-width:0}
.bubbles{display:grid;gap:8px}
.bubble{display:grid;gap:2px;text-align:left;max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px}
.bubble.them{background:var(--b-soft);border-bottom-left-radius:6px;justify-self:start}
.bubble.me{background:var(--a-soft);border-bottom-right-radius:6px;justify-self:end}
.bubble-who{font-size:12px;color:var(--muted);font-weight:600}
.bubble-text{overflow-wrap:anywhere}
.note-btn{justify-self:start}
.celebrate{background:var(--both);color:#fff;font-weight:600;margin-bottom:12px;text-align:center;font-size:17px}
/* 새 소식 */
.news-card{border:2px solid var(--warn);display:grid;gap:10px;margin-bottom:12px}
.news-card .h3{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--warn)}
.news-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.news-list li{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.news-list li span{min-width:0;overflow-wrap:anywhere}
.news-list small{color:var(--muted);flex:none;font-size:12px;padding-top:2px}
/* 둘 다 비는 시간 */
.free-card{background:var(--both-soft);box-shadow:none;margin-bottom:8px}
.free-card .h3{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--both);font-size:15px;margin-bottom:8px}
.free-list{display:grid;gap:6px}
@media (min-width:700px){.free-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.free-slot{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border-radius:12px;background:var(--surface);text-align:left;font-size:15px}
.fs-day{font-weight:700;min-width:62px}
.fs-time{flex:1;min-width:0}
.fs-go{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--both);flex:none}
.free-inline{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--both-soft);color:var(--both);font-size:14px;font-weight:600}
.free-inline .link{color:var(--both);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}
/* 반응 */
.react-chip{display:inline-flex;align-items:center;gap:1px;padding:1px 7px;border-radius:999px;background:var(--surface2);font-size:13px}
.react-chip small{font-size:10px}
.react-bar{display:flex;gap:6px;flex-wrap:wrap}
.react-bar button{width:48px;height:48px;border-radius:14px;font-size:22px;background:var(--bg);border:2px solid var(--line)}
.react-bar button[aria-pressed="true"]{border-color:var(--both);background:var(--both-soft)}
/* 반복 요일 */
.wd-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.wd-pick button{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.wd-pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* 한마디 대화 */
.chat{display:grid;gap:10px;max-height:44vh;overflow-y:auto;padding:4px 2px}
.chat-row{display:flex;gap:8px;align-items:flex-end;max-width:90%}
.chat-row.me{flex-direction:row-reverse;justify-self:end;text-align:right}
.chat-row .ava{width:32px;height:32px;font-size:17px;flex:none}
.chat-b{padding:10px 14px;border-radius:18px;background:var(--b-soft);font-size:15px;overflow-wrap:anywhere;text-align:left}
.chat-row.me .chat-b{background:var(--a-soft)}
/* 추억 */
.memories{display:grid;gap:16px}
.mem-month{display:grid;gap:8px}
.mem-m{font-weight:700;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.mem-emo{width:44px;height:44px;border-radius:12px;background:var(--both-soft);display:grid;place-items:center;font-size:22px;flex:none}
.mem-body{display:grid;gap:2px;min-width:0}
.mem-title{font-weight:700;overflow-wrap:anywhere}
.mem-review{font-family:var(--f-display);font-size:15px;color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.mem-add{display:inline-flex;align-items:center;gap:4px}

/* 둘 다 비는 시간 (30분 단위) */
.free-days{display:grid;gap:10px}
.free-day{display:grid;gap:6px}
.fd-label{font-weight:700;font-size:14px}

.free-chips{display:flex;flex-wrap:wrap;gap:6px}
.free-chip{display:inline-flex;align-items:baseline;gap:5px;min-height:40px;padding:8px 12px;border-radius:12px;background:var(--surface);color:var(--ink);font-size:14px}
.free-chip small{font-size:11px;color:var(--muted)}
.free-chip:hover{outline:2px solid var(--both)}
.free-inline{display:grid;gap:8px}
.fi-title{display:flex;align-items:center;gap:6px}
/* 월간 */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.month-nav .arrow{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;color:var(--muted);background:var(--surface)}
.mn-label{font-weight:700;font-size:17px}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:4px}
.mhead{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.mhead.sun{color:var(--b)} .mhead.sat{color:var(--a)}
.mcell{min-height:58px;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-width:0;overflow:hidden}
.mcell.out{opacity:.4}
.mnum{font-weight:700;font-size:15px;position:relative;line-height:1.2}
.mann{position:absolute;left:100%;top:-4px;font-style:normal;font-size:10px}
.mcell.is-today .mnum{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.mcell[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mcell[aria-pressed="true"] .mitem{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}
.mitems{display:none;width:100%;gap:2px;flex-direction:column}
.mitem{font-size:11px;line-height:1.3;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.mitem.a{background:var(--a-soft);color:var(--a)} .mitem.b{background:var(--b-soft);color:var(--b)} .mitem.both{background:var(--both-soft);color:var(--both)}
.mitem.done{text-decoration:line-through;opacity:.7}
.mmore{font-size:11px;color:var(--muted)}
.mdots{align-items:center;height:auto;gap:2px;flex-wrap:wrap;justify-content:center}
.mdots b{font-size:10px;line-height:1}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin:8px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%}
.legend i.a{background:var(--a)} .legend i.b{background:var(--b)} .legend i.both{background:var(--both)}
.month-day{scroll-margin-top:80px}
@media (min-width:700px){
  .mcell{min-height:104px;align-items:stretch;padding:6px}
  .mnum{align-self:flex-start;font-size:14px}
  .mitems{display:flex}
  .mdots{display:none}
  .month-grid{gap:6px}
}

/* 매일 체크 */
.ck-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ck-day{display:grid;justify-items:center;gap:4px;padding:6px 0;border-radius:12px;min-height:64px}
.ck-day:disabled{cursor:default}
.ck-wd{font-size:12px;font-weight:700;color:var(--muted)}
.ck-day.today .ck-wd{color:var(--ink)}
.ck-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px}
.ck-day.today .ck-dot{border-color:var(--ink)}
.ck-day.full .ck-dot{background:var(--fillc);border-color:var(--fillc);color:#fff}
.ck-day.half .ck-dot{background:linear-gradient(90deg,var(--fillc) 50%,transparent 50%);border-color:var(--fillc);color:#fff}
.ck-day.off .ck-dot{border-style:dashed;opacity:.6}
.ck-day:disabled:not(.full):not(.half) .ck-dot{opacity:.5}
.btn.ck-done{background:var(--ok-soft);color:var(--ok)}
.ck-today{margin-bottom:12px;display:grid;gap:4px}
.ck-today .h3{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.ck-row{display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid var(--line)}
.ck-row:first-of-type{border-top:0}
.ck-name{flex:1;min-width:0;font-weight:600;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.ck-name small{font-size:12px;color:var(--muted);font-weight:500}
.bars.has-line{position:relative}
.bars.has-line::after{content:"";position:absolute;left:0;right:0;bottom:calc(21px + (100% - 40px) * var(--line));border-top:2px dashed var(--muted);opacity:.6;pointer-events:none}
.bar.met .fill{background:var(--ok)}
.chip small{font-size:12px;opacity:.7}
/* 기록 수정 */
.log-list{display:grid;gap:6px}
.log-row{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.log-view{display:flex;align-items:center;gap:10px;min-height:40px}
.log-d{min-width:64px;font-size:14px;color:var(--muted);font-weight:600}
.log-btns{margin-left:auto}
.log-edit{display:grid;gap:8px}
.log-edit .input{min-height:46px}
button.bar{background:none;padding:0;border-radius:8px}
button.bar:hover .track{outline:2px solid var(--line)}
.ck-cal-head,.ck-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.ck-cal-head span{font-size:12px;font-weight:700;color:var(--muted)}
.ck-cal{margin-top:6px}
.ck-cell{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:14px;display:grid;place-items:center}
.ck-cell.out{visibility:hidden}
.ck-cell.off{border-style:dashed;opacity:.55}
.ck-cell.full{background:var(--fillc);border-color:var(--fillc);color:#fff}
.ck-cell.half{background:linear-gradient(90deg,var(--fillc) 50%,transparent 50%);border-color:var(--fillc)}
.ck-cell.today{box-shadow:0 0 0 2px var(--ink)}
.ck-cell:disabled:not(.full):not(.half){opacity:.4}
/* 일기 */
.mood-pick{display:flex;gap:6px;flex-wrap:wrap}
.mood-pick button{display:grid;justify-items:center;width:58px;padding:6px 0;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
.mood-pick button span{font-size:24px;line-height:1.2}
.mood-pick button small{font-size:11px;color:var(--muted)}
.mood-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.diary-text{min-height:200px;line-height:1.7}
.diary-cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:12px}
.diary-cta > span{flex:1;display:grid}
.diary-days{display:grid;gap:4px}
.diary-day{display:grid;gap:8px}
.diary-item{display:grid;gap:8px;text-align:left;width:100%}
.diary-item + .diary-item{margin-top:0}
.di-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.di-mood{font-size:20px}
.di-text{font-family:var(--f-display);font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.diary-full{font-family:var(--f-display);font-size:17px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
/* 감사 */
.thanks-card{display:grid;gap:8px;margin-bottom:12px;background:var(--b-soft);box-shadow:none}
.thanks-card .h3{display:flex;align-items:center;gap:8px;font-weight:700}
.th-row{display:grid;gap:2px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface)}
.th-who{font-size:12px;font-weight:700;color:var(--muted)}
.th-text{font-family:var(--f-display);font-size:16px;overflow-wrap:anywhere}
.th-pair{display:grid;gap:6px}
.th-pair .th-row{background:var(--b-soft)}
.th-pair .th-row.me{background:var(--a-soft)}
.th-pair .th-row:disabled{cursor:default;opacity:1}
.tab span:last-child{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

/* ========== 4. 저장소 (체험: 메모리 / 실제: Firebase RTDB) ========== */
let store = null, unsubs = [], fb = null;

function makeDemoStore() {
  const tree = {};
  const subs = new Set();
  const keys = p => p.split("/").filter(Boolean);
  const getAt = p => keys(p).reduce((o, k) => (o == null ? undefined : o[k]), tree);
  const setAt = (p, v) => {
    const ks = keys(p); let o = tree;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    if (v == null) delete o[ks.at(-1)]; else o[ks.at(-1)] = JSON.parse(JSON.stringify(v));
  };
  let queued = false;
  const flush = () => { if (queued) return; queued = true; queueMicrotask(() => { queued = false; subs.forEach(s => s.cb(structuredClone(getAt(s.p) ?? null))); }); };
  return {
    listen(p, cb) { const s = { p, cb }; subs.add(s); cb(structuredClone(getAt(p) ?? null)); return () => subs.delete(s); },
    async set(p, v) { setAt(p, v); flush(); },
    async update(p, obj) { for (const k in obj) setAt((p ? p + "/" : "") + k, obj[k]); flush(); },
    async remove(p) { setAt(p, null); flush(); },
    newId: localId
  };
}

function makeFbStore(base) {
  const r = p => fb.ref(fb.db, p ? `${base}/${p}` : base);
  return {
    listen(p, cb) {
      return fb.onValue(r(p), snap => cb(snap.val()), err => { console.warn(p, err); toast("데이터를 불러오지 못했어요. 다시 로그인해 주세요."); });
    },
    set: (p, v) => fb.set(r(p), v),
    update: (p, o) => fb.update(r(p), o),
    remove: p => fb.remove(r(p)),
    newId: () => fb.push(fb.ref(fb.db, `${base}/_ids`)).key
  };
}

async function save(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { console.error(e); toast(String(e?.code || e).includes("PERMISSION") ? "권한이 없어 저장하지 못했어요." : "저장하지 못했어요. 인터넷 연결을 확인해 주세요."); return false; }

async function removeSamples() {
  const up = {};
  for (const [id, e] of entries(S.events)) if (e.sample && (e.owner === S.me || e.type === "together")) up[`events/${id}`] = null;
  for (const [id, e] of entries(S.priv.events)) if (e.sample) up[`private/${S.me}/events/${id}`] = null;
  for (const [id, p] of entries(S.plans)) if (p.sample) up[`plans/${id}`] = null;
  for (const [id, g] of entries(S.goals)) if (g.sample && (g.owner === S.me || g.owner === "both")) { up[`goals/${id}`] = null; up[`logs/${id}`] = null; }
  for (const [id, g] of entries(S.priv.goals)) if (g.sample) { up[`private/${S.me}/goals/${id}`] = null; up[`private/${S.me}/logs/${id}`] = null; }
  if (!Object.keys(up).length) return toast("지울 샘플이 없어요.");
  await save(() => store.update("", up), "샘플 데이터를 지웠어요.");
}

/* ========== 6. 데이터 가공 ========== */
/* 반복 일정 */
const REPEATS = { none: "반복 안 함", daily: "매일", weekdays: "평일", weekly: "매주" };
const isRepeat = e => e.repeat && e.repeat.freq && e.repeat.freq !== "none";
function occursOn(e, d) {
  if (d < e.date || (e.repeat?.until && d > e.repeat.until) || e.skip?.[d]) return false;
  const wd = parseD(d).getDay(), f = e.repeat?.freq || "none";
  if (f === "daily") return true;
  if (f === "weekdays") return wd >= 1 && wd <= 5;
  if (f === "weekly") return (e.repeat.days?.length ? e.repeat.days : [parseD(e.date).getDay()]).includes(wd);
  return d === e.date;
}
function repeatLabel(r) {
  if (!r || r.freq === "none") return "";
  if (r.freq === "weekly") return "매주 " + (r.days?.length ? [...r.days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(x => WD[x]).join("·") : "");
  return REPEATS[r.freq];
}
const monthStart = d => d.slice(0, 8) + "01";
const monthEnd = d => { const x = parseD(monthStart(d)); x.setMonth(x.getMonth() + 1); x.setDate(0); return ds(x); };
function itemWindow() {
  const g0 = weekStart(monthStart(S.sel)), g1 = addDays(weekStart(monthEnd(S.sel)), 6);
  const a = [todayStr(), g0].sort()[0], b = [todayStr(), g1].sort()[1];
  return [addDays(a, -42), addDays(b, 21)];
}
function allItems() {
  const base = [];
  for (const [id, e] of entries(S.priv.events)) base.push({ ...e, id, src: "priv", scope: "private", owner: S.me });
  for (const [id, e] of entries(S.events)) base.push({ ...e, id, src: "shared", scope: e.type === "together" ? "together" : "shared" });
  const out = [];
  const [w0, w1] = itemWindow();
  for (const e of base) {
    if (!isRepeat(e)) { out.push(e); continue; }
    for (let d = e.date > w0 ? e.date : w0; d <= w1; d = addDays(d, 1))
      if (occursOn(e, d)) out.push({ ...e, id: `${e.id}@${d}`, baseId: e.id, occ: d, seriesDate: e.date, date: d, done: !!e.doneDates?.[d] });
  }
  for (const [id, p] of entries(S.plans)) if (p.status === "confirmed" && p.date)
    out.push({ id, src: "plan", scope: "together", owner: p.proposer, title: p.title, date: p.date, time: p.time, endTime: "", place: p.place, memo: p.memo, done: !!p.done, cat: p.cat, review: p.review });
  return out.sort((x, y) => (x.date + (x.time || "00:00")).localeCompare(y.date + (y.time || "00:00")));
}
const itemPath = it => (it.src === "priv" ? `private/${S.me}/events/${it.baseId || it.id}` : it.src === "plan" ? `plans/${it.id}` : `events/${it.baseId || it.id}`);
const reactKey = it => `${it.src}_${it.id}`;

/* 둘 다 비는 시간 — 평일 저녁 6~11시, 주말 오전 10시~오후 10시 중 1시간 30분 이상 빈 구간 */
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const durText = m => `${Math.floor(m / 60) ? Math.floor(m / 60) + "시간" : ""}${m % 60 ? " " + (m % 60) + "분" : ""}`.trim();
function freeSlots(from, days) {
  // 하루 전체(0시~24시)에서 30분 단위로, 둘 다 30분 이상 빈 구간
  const items = allItems(), out = [], t = todayStr();
  const fl = m => Math.floor(m / 30) * 30, ce = m => Math.ceil(m / 30) * 30;
  for (let i = 0; i < days; i++) {
    const d = addDays(from, i); if (d < t) continue;
    let ws = 0; const we = 1440;
    if (d === t) { const n = new Date(); ws = ce(n.getHours() * 60 + n.getMinutes() + 1); }
    const busy = items.filter(it => it.date === d && it.time).map(it => {
      const s = toMin(it.time); let e = it.endTime ? toMin(it.endTime) : s + 60;
      if (e <= s) e = 1440;
      return [fl(s), Math.min(1440, ce(e))];
    }).sort((a, b) => a[0] - b[0]);
    let cur = ws;
    for (const [s, e] of busy) { if (Math.min(s, we) - cur >= 30) out.push({ d, s: cur, e: Math.min(s, we) }); cur = Math.max(cur, e); }
    if (we - cur >= 30) out.push({ d, s: cur, e: we });
  }
  return out;
}
const freeChip = f => `<button class="free-chip" data-act="free" data-d="${f.d}" data-t="${fromMin(f.s % 1440)}" aria-label="${fmtShort(f.d)} ${fromMin(f.s)}부터 ${fromMin(f.e)}까지 계획 제안">
  <b>${f.s === 0 && f.e === 1440 ? "하루 종일" : `${fromMin(f.s)}–${fromMin(f.e)}`}</b><small>${durText(f.e - f.s)}</small></button>`;
function freeCard(from, days, title) {
  const slots = freeSlots(from, days), byDay = {};
  slots.forEach(f => (byDay[f.d] ||= []).push(f));
  return `<section class="card free-card" aria-label="${title}">
    <div class="h3">${ic("heart", "sm")}${title}</div>
    ${slots.length ? `<div class="free-days">${Object.entries(byDay).map(([d, fs]) => `
      <div class="free-day"><span class="fd-label">${fmtShort(d)}</span><div class="free-chips">${fs.map(freeChip).join("")}</div></div>`).join("")}</div>`
      : `<div class="empty">이 기간에는 둘 다 비는 시간이 없어요.</div>`}
    <p class="small" style="margin:8px 0 0">하루 전체(0시~24시)에서 30분 단위로 찾아요. 시간을 누르면 그 시간으로 계획을 제안해요. ${esc(prof(P()).name)}님의 비공개 일정은 계산에 들어가지 않아요.</p>
  </section>`;
}

/* 함께한 날·기념일 */
function dayCount() { const s = S.info?.startDate; return s ? diffDays(s, todayStr()) + 1 : null; }
function annivBetween(a, b) {
  const out = [], s = S.info?.startDate, y0 = parseD(a).getFullYear(), y1 = parseD(b).getFullYear();
  if (s) {
    for (let k = 1; ; k++) { const d = addDays(s, k * 100 - 1); if (d > b) break; if (d >= a) out.push({ date: d, title: `${k * 100}일`, emoji: "💯" }); }
    const sy = parseD(s).getFullYear();
    for (let y = y0; y <= y1; y++) if (y > sy) out.push({ date: `${y}${s.slice(4)}`, title: `${y - sy}주년`, emoji: "💍" });
  }
  for (const [id, x] of entries(S.anniv)) {
    if (!x.date) continue;
    if (x.yearly) { for (let y = y0; y <= y1; y++) out.push({ id, date: `${y}${x.date.slice(4)}`, title: x.title, emoji: x.emoji || "🎉" }); }
    else out.push({ id, date: x.date, title: x.title, emoji: x.emoji || "🎉" });
  }
  return out.filter(x => x.date >= a && x.date <= b).sort((p, q) => p.date.localeCompare(q.date));
}
const upcomingAnniv = (limit = 3) => annivBetween(todayStr(), addDays(todayStr(), 800)).slice(0, limit);
const ddayText = d => { const n = diffDays(todayStr(), d); return n === 0 ? "오늘!" : `D-${n}`; };
const unseenActs = () => entries(S.activity).filter(([, a]) => a.by === P() && a.at > (S.slots[S.me]?.lastSeen || 0)).sort((a, b) => b[1].at - a[1].at);

const REACTS = ["❤️", "👏", "💪", "😋", "🥺", "🎉"];
function reactChips(it) {

}

}

    title = `${m.getFullYear()}년 ${m.getMonth() + 1}월`;
    nav = `<div class="month-nav">
      <button class="arrow" data-act="month" data-v="-1" aria-label="지난달">${ic("left")}</button>
      <span class="mn-label">${m.getMonth() + 1}월</span>
      <button class="arrow" data-act="month" data-v="1" aria-label="다음 달">${ic("right")}</button></div>`;
    body = monthHTML(all);
  } else {
    title = `${fmtShort(ws).split(" ")[0]} – ${fmtShort(addDays(ws, 6)).split(" ")[0]}`;
    const strip = days.map(d => {
      const its = all.filter(i => i.date === d);
      const kinds = [...new Set(its.map(whoOf))].slice(0, 3);
      return `<button class="wday ${d === t ? "is-today" : ""}" data-act="sel" data-v="${d}" aria-pressed="${d === S.sel}" aria-label="${fmtDate(d)}, 일정 ${its.length}개">
        ${WD[parseD(d).getDay()]}<b>${parseD(d).getDate()}</b><span class="dots">${kinds.map(k => `<i class="${k}"></i>`).join("")}</span></button>`;
    }).join("");
    nav = `<div class="week-nav">
      <button class="arrow" data-act="week" data-v="-7" aria-label="지난주">${ic("left")}</button>
      <div class="week-strip">${strip}</div>
      <button class="arrow" data-act="week" data-v="7" aria-label="다음 주">${ic("right")}</button></div>`;
    if (S.view === "day") body = dayListHTML(all, S.sel);
    else {
      const showFree = addDays(ws, 6) >= t;
      body = `${showFree ? freeCard(ws, 7, "이번 주 둘 다 비는 시간") : ""}<div class="week-grid">${days.map(d => {
        const its = all.filter(i => i.date === d);
        return `<section><div class="day-label ${d === t ? "today" : ""}">${fmtShort(d)}</div>
          ${its.length ? `<div class="timeline">${its.map(i => rowHTML(i)).join("")}</div>` : `<button class="btn ghost sm block" data-act="new-event" data-date="${d}">${ic("plus", "sm")}추가</button>`}</section>`;
      }).join("")}</div>`;
    }
  }
  return `
    <div class="screen-head"><div><div class="eyebrow">일정</div><h1 class="big-date">${title}</h1></div>
      <div class="seg" role="group" aria-label="보기 전환">
        <button data-act="view" data-v="day" aria-pressed="${S.view === "day"}">하루</button>
        <button data-act="view" data-v="week" aria-pressed="${S.view === "week"}">주간</button>
        <button data-act="view" data-v="month" aria-pressed="${S.view === "month"}">월간</button>
      </div></div>
    ${nav}
    <div class="chips" role="group" aria-label="누구 일정 보기">
      ${filters.map(([k, l]) => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${S.filter === k}">${esc(l)}</button>`).join("")}
      ${S.sel !== t ? `<button class="chip" data-act="sel" data-v="${t}">오늘로</button>` : ""}
    </div>
    <div class="swipe-area" id="swipe">${body}</div>
    <p class="swipe-hint">${ic("left", "sm")}좌우로 밀면 ${S.view === "day" ? "하루씩" : S.view === "week" ? "한 주씩" : "한 달씩"} 넘어가요${ic("right", "sm")}</p>`;
}

function planCard(id, p) {
  const [emo, catName] = PLAN_CATS[p.cat] || PLAN_CATS.etc;
  const mine = p.proposer === S.me;
  const status = p.status === "confirmed" ? `<span class="pill ok">${ic("check", "sm")}확정</span>` : p.status === "declined" ? `<span class="pill no">다음에</span>` : `<span class="pill wait">${mine ? "답 기다리는 중" : "확인 필요"}</span>`;
  let actions = "";
  if (p.status === "proposed" && !mine) actions = `<div class="plan-actions"><button class="btn both" data-act="plan-ok" data-id="${id}">${ic("check")}좋아요, 확정</button><button class="btn ghost" data-act="plan-no" data-id="${id}">다음에</button></div>`;
  else if (p.status === "declined") actions = `<div class="plan-actions"><button class="btn ghost sm" data-act="plan-edit" data-id="${id}">${ic("edit", "sm")}날짜 바꿔 다시 제안</button></div>`;
  return `<article class="card plan">
    <div class="plan-top"><div class="plan-ico" aria-hidden="true">${emo}</div>
      <div class="plan-body"><button class="plan-title" style="text-align:left" data-act="plan-edit" data-id="${id}">${esc(p.title)}</button>
        <div class="plan-meta"><span>${catName}</span>${p.date ? `<span>${fmtShort(p.date)} ${p.time ? fmtTimeKo(p.time) : ""}</span>` : "<span>날짜 미정</span>"}${p.place ? `<span>${ic("pin", "sm")} ${esc(p.place)}</span>` : ""}</div>
        <div class="row-meta">${status}<span class="tag">${esc(prof(p.proposer).avatar)} ${esc(prof(p.proposer).name)}${mine ? "(나)" : ""} 제안</span>${reactChips({ src: "plan", id })}</div>
      </div></div>
    ${p.memo ? `<div class="note">${ic("note", "sm")}<span>${esc(p.memo)}</span></div>` : ""}
    ${actions}</article>`;
}

function memories() {
  const t = todayStr(), list = [];
  for (const [id, p] of entries(S.plans)) if (p.status === "confirmed" && p.date && (p.date < t || (p.date === t && p.done)))
    list.push({ id, src: "plan", date: p.date, title: p.title, place: p.place, emoji: PLAN_CATS[p.cat]?.[0] || "✨", review: p.review });
  for (const [id, e] of entries(S.events)) if (e.type === "together" && !isRepeat(e) && e.date < t)
    list.push({ id, src: "shared", date: e.date, title: e.title, place: e.place, emoji: "💞", review: e.review });
  list.sort((a, b) => b.date.localeCompare(a.date));
  const months = {};
  list.forEach(m => (months[m.date.slice(0, 7)] ||= []).push(m));
  return { count: list.length, html: Object.entries(months).map(([ym, ms]) => `
    <div class="mem-month"><div class="mem-m">${+ym.slice(0, 4)}년 ${+ym.slice(5)}월 <span class="count">${ms.length}</span></div>
      ${ms.map(m => `<button class="mem" data-act="${m.src === "plan" ? "plan-edit" : "open"}" data-src="${m.src}" data-id="${m.id}">
        <span class="mem-emo" aria-hidden="true">${m.emoji}</span>
        <span class="mem-body"><span class="mem-title">${esc(m.title)}</span><span class="small">${fmtShort(m.date)}${m.place ? " · " + esc(m.place) : ""}</span>
        ${m.review ? `<span class="mem-review">“${esc(m.review)}”</span>` : m.src === "plan" ? `<span class="small mem-add">${ic("edit", "sm")}한 줄 후기 남기기</span>` : ""}</span>
      </button>`).join("")}</div>`).join("") };
}

function renderPlans() {
  const t = todayStr(), ps = entries(S.plans).sort((a, b) => ((a[1].date || "9") + (a[1].time || "")).localeCompare((b[1].date || "9") + (b[1].time || "")));
  const need = ps.filter(([, p]) => p.status === "proposed" && p.proposer !== S.me);
  const wait = ps.filter(([, p]) => p.status === "proposed" && p.proposer === S.me);
  const conf = ps.filter(([, p]) => p.status === "confirmed" && p.date >= t && !(p.date === t && p.done));
  const declined = ps.filter(([, p]) => p.status === "declined");
  const mem = memories();
  const sec = (title, list, emptyMsg) => `<h2 class="h2">${title} <span class="count">${list.length}</span></h2>
    ${list.length ? `<div class="grid-2">${list.map(([id, p]) => planCard(id, p)).join("")}</div>` : `<div class="empty">${emptyMsg}</div>`}`;
  return `
    <div class="screen-head"><div><div class="eyebrow">함께할 계획</div><h1 class="big-date">둘이 함께할 일</h1></div></div>
    <p class="small" style="margin:0 0 12px">한 사람이 제안하면 다른 사람이 확인해서 확정해요. 확정된 계획은 오늘·일정 화면에 <b>함께</b>로 표시돼요.</p>
    ${freeCard(t, 7, "앞으로 7일, 둘 다 비는 시간")}
    ${sec(`${esc(prof(P()).name)}님이 제안했어요`, need, "확인할 제안이 없어요.")}
    ${sec("내가 제안한 계획", wait, "답을 기다리는 제안이 없어요.")}
    ${sec("확정된 계획", conf, "아직 확정된 계획이 없어요.")}
    ${declined.length ? sec("다음에 하기로 한 계획", declined.slice(0, 4), "") : ""}
    <h2 class="h2">${ic("heart", "sm")}우리의 추억 <span class="count">함께한 일 ${mem.count}개</span></h2>
    ${mem.count ? `<div class="memories">${mem.html}</div>` : `<div class="empty">함께한 계획이 지나가면 여기에 모여요.</div>`}`;
}

/* 목표: 양 목표(일간·주간·월간 목표량)와 매일 체크 목표 */
const PERIODS = { day: "일간", week: "주간", month: "월간" };
const PERIOD_NOW = { day: "오늘", week: "이번 주", month: "이번 달" };
const isCheck = g => g.kind === "check";
const goalPer = g => (isCheck(g) ? "day" : g.period || "week");
const goalTarget = g => +(g.target ?? g.weekly ?? 0) || 0;
const checkDays = g => (g.days?.length ? g.days : [0, 1, 2, 3, 4, 5, 6]);

function goalStats(g) {
  const t = todayStr(), ws = weekStart(t), logs = Object.values(g.logs || {});
  const sumRange = (a, b) => num(logs.filter(l => l.date >= a && l.date <= b).reduce((s, l) => s + (+l.value || 0), 0));
  const days = [...Array(7)].map((_, i) => { const d = addDays(ws, i); return { d, v: sumRange(d, d) }; });
  const weeks = [-3, -2, -1, 0].map(k => { const a = addDays(ws, k * 7); return { a, label: k === 0 ? "이번 주" : fmtShort(a).split(" ")[0] + "~", v: sumRange(a, addDays(a, 6)) }; });
  const months = [-3, -2, -1, 0].map(k => { const x = parseD(monthStart(t)); x.setMonth(x.getMonth() + k); const a = ds(x); return { a, label: k === 0 ? "이번 달" : `${x.getMonth() + 1}월`, v: sumRange(a, monthEnd(a)) }; });
  return { days, weeks, months, today: sumRange(t, t), week: weeks[3].v, month: months[3].v };
}

/* 매일 체크 */
const checkKey = (d, s) => `${d}_${s}`;
function checkState(g, d) {
  const L = g.logs || {};
  if (g.owner === "both") { const a = !!L[checkKey(d, "a")], b = !!L[checkKey(d, "b")]; return { mine: !!L[checkKey(d, S.me)], full: a && b, half: a !== b }; }
  const done = !!L[checkKey(d, g.owner)] || Object.values(L).some(l => l.date === d);
  return { mine: done, full: done, half: false };
}
function checkStreak(g) {
  const t = todayStr(); let n = 0, d = checkState(g, t).full ? t : addDays(t, -1);
  for (let i = 0; i < 400; i++, d = addDays(d, -1)) {
    if (!checkDays(g).includes(parseD(d).getDay())) continue;
    if (checkState(g, d).full) n++; else break;
  }
  return n;
}
function checkMonth(g) {
  const t = todayStr(); let done = 0, total = 0;
  for (let d = monthStart(t); d <= t; d = addDays(d, 1)) if (checkDays(g).includes(parseD(d).getDay())) { total++; if (checkState(g, d).full) done++; }
  return { done, total };
}
const goalLogPath = g => (g.src === "priv" ? `private/${S.me}/logs/${g.id}` : `logs/${g.id}`);
async function toggleCheck(g, d) {
  if (!canEditGoal(g) || d > todayStr()) return;
  const was = checkState(g, d).mine, path = `${goalLogPath(g)}/${checkKey(d, S.me)}`;
  const ok = await save(() => store.set(path, was ? null : { date: d, value: 1, by: S.me, at: Date.now() }), was ? "체크를 취소했어요." : d === todayStr() ? "오늘 체크했어요! ✅" : `${fmtShort(d)} 체크했어요.`);
  if (ok && !was && g.src === "shared") logAct(`${q(g.title)} ${d === todayStr() ? "오늘" : fmtShort(d)} 체크했어요 ✅`);
}

function goalHead(g, extra = "") {
  const [emo, kindName] = GOAL_KINDS[g.kind] || GOAL_KINDS.custom;
  const t = todayStr(), dd = g.targetDate ? diffDays(t, g.targetDate) : null, edit = canEditGoal(g);
  const vis = g.owner === "both" ? whoChip("both") : `${whoChip(g.owner)}${g.owner === S.me ? (g.shared ? `<span class="tag">${ic("eye", "sm")}공유 중</span>` : `<span class="tag">${ic("lock", "sm")}나만</span>`) : ""}`;
  const perTag = isCheck(g) ? `<span class="tag">${checkDays(g).length === 7 ? "매일" : [1, 2, 3, 4, 5, 6, 0].filter(x => checkDays(g).includes(x)).map(x => WD[x]).join("·")} 체크</span>`
    : `<span class="tag">${kindName} · ${PERIODS[goalPer(g)]}${goalTarget(g) ? ` ${goalTarget(g)}${esc(g.unit || "")}` : ""}</span>`;
  return `<div class="goal-head"><div class="goal-ico" aria-hidden="true">${emo}</div>
      <div style="flex:1;min-width:0"><button class="goal-title" style="text-align:left" data-act="goal-edit" data-src="${g.src}" data-id="${g.id}" ${edit ? "" : "disabled"}>${esc(g.title)}</button>
        <div class="goal-sub">${vis}${perTag}</div></div>
      ${extra || (dd !== null ? `<div class="dday-box"><b>${dd > 0 ? "D-" + dd : dd === 0 ? "D-DAY" : "D+" + -dd}</b><span>${fmtShort(g.targetDate)}</span></div>` : "")}
    </div>${g.memo ? `<div class="small">${esc(g.memo)}</div>` : ""}`;
}

function checkCard(g) {
  const t = todayStr(), ws = weekStart(t), edit = canEditGoal(g);
  const color = g.owner === "both" ? "var(--both)" : `var(--${g.owner})`;
  const st = checkState(g, t), streak = checkStreak(g), mo = checkMonth(g), sched = checkDays(g).includes(parseD(t).getDay());
  const week = [...Array(7)].map((_, i) => {
    const d = addDays(ws, i), on = checkDays(g).includes(parseD(d).getDay()), c = checkState(g, d), fut = d > t;
    const cls = c.full ? "full" : c.half ? "half" : "";
    return `<button class="ck-day ${cls} ${d === t ? "today" : ""} ${on ? "" : "off"}" data-act="check" data-src="${g.src}" data-id="${g.id}" data-d="${d}" ${!edit || fut ? "disabled" : ""}
      aria-pressed="${c.mine}" aria-label="${fmtDate(d)} ${c.full ? "완료" : c.half ? "한 사람 완료" : "미완료"}"><span class="ck-wd">${WD[parseD(d).getDay()]}</span><span class="ck-dot">${c.full || c.half ? ic("check", "sm") : on ? "" : "–"}</span></button>`;
  }).join("");
  const partnerNote = g.owner === "both" ? (() => { const L = g.logs || {}; const p = !!L[checkKey(t, P())]; return `<span class="small">${esc(prof(P()).avatar)} ${esc(prof(P()).name)}님 오늘 ${p ? "체크 완료 ✅" : "아직이에요"}</span>`; })() : "";
  return `<article class="card goal" style="--fillc:${color}">
    ${goalHead(g, `<div class="dday-box"><b>${streak}</b><span>🔥 연속</span></div>`)}
    <div class="ck-week" aria-label="이번 주 체크">${week}</div>
    <div class="progress">
      <div class="progress-line"><span>이번 달</span><span><b>${mo.done}</b> / ${mo.total}일</span></div>
      <div class="meter"><i style="width:${mo.total ? (mo.done / mo.total) * 100 : 0}%"></i></div>
    </div>
    ${partnerNote}
    <button class="btn ghost sm block" data-act="check-hist" data-src="${g.src}" data-id="${g.id}">${ic("cal", "sm")}지난 기록 보기${edit ? "·수정" : ""}</button>
    ${edit ? (sched || st.mine ? `<button class="btn block ${st.mine ? "ck-done" : "primary"}" data-act="check" data-src="${g.src}" data-id="${g.id}" data-d="${t}">${st.mine ? `${ic("check")}오늘 완료! (누르면 취소)` : `${ic("check")}오늘 체크하기`}</button>` : `<div class="small">오늘은 체크하는 날이 아니에요.</div>`)
      : `<div class="small">${ic("eye", "sm")} ${esc(prof(g.owner).name)}님이 공유한 목표예요. 보기만 할 수 있어요.</div>`}
  </article>`;
}

function goalCard(g) {
  if (isCheck(g)) return checkCard(g);
  const unit = g.unit || GOAL_KINDS[g.kind]?.[2] || "";
  const st = goalStats(g), t = todayStr(), per = goalPer(g), target = goalTarget(g);
  const color = g.owner === "both" ? "var(--both)" : `var(--${g.owner})`;
  const cur = per === "day" ? st.today : per === "week" ? st.week : st.month;
  const max = Math.max(...st.days.map(d => d.v), per === "day" && target ? target : target ? target / 3 : 1, 0.1);
  const edit = canEditGoal(g);
  const metDays = per === "day" && target ? st.days.filter(d => d.d <= t && d.v >= target).length : null;
  const summary = per === "month" ? st.months : st.weeks;
  return `<article class="card goal" style="--fillc:${color}">
    ${goalHead(g)}
    <div class="progress">
      <div class="progress-line"><span>${PERIOD_NOW[per]} 기록</span><span><b>${cur}</b> ${target ? `/ ${target}` : ""} ${esc(unit)}${target && cur >= target ? " 🎉" : ""}</span></div>
      ${target ? `<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${target}" aria-valuenow="${cur}"><i style="width:${Math.min(100, (cur / target) * 100)}%"></i></div>` : ""}
    </div>
    <div class="bars ${per === "day" && target ? "has-line" : ""}" style="--line:${per === "day" && target ? Math.min(1, target / max).toFixed(3) : 0}" aria-label="이번 주 요일별 기록">
      ${st.days.map(d => `<${edit && d.d <= t ? `button type="button" data-act="log-day" data-src="${g.src}" data-id="${g.id}" data-d="${d.d}" aria-label="${fmtDate(d.d)} 기록 보기·수정"` : "div"} class="bar ${d.d === t ? "today" : ""} ${per === "day" && target && d.v >= target ? "met" : ""}"><span class="v">${d.v || ""}</span><span class="track"><span class="fill" style="height:${(d.v / max) * 100}%"></span></span><span class="d">${WD[parseD(d.d).getDay()]}</span></${edit && d.d <= t ? "button" : "div"}>`).join("")}
    </div>
    ${metDays !== null ? `<div class="small">이번 주 하루 목표 달성 <b>${metDays}일</b> (점선이 하루 목표 ${target}${esc(unit)})</div>` : ""}
    <div class="weeks4" aria-label="${per === "month" ? "최근 4달" : "최근 4주"} 합계">
      ${summary.map((w, i) => `<div class="${i === 3 ? "cur" : ""}">${w.label}<b>${w.v}${esc(unit)}</b></div>`).join("")}
    </div>
    ${edit ? `<div class="actions"><button class="btn primary" data-act="log" data-src="${g.src}" data-id="${g.id}">${ic("plus")}기록 추가</button><button class="btn ghost" data-act="log" data-src="${g.src}" data-id="${g.id}" data-d="${addDays(t, -1)}">${ic("edit", "sm")}지난 기록 수정</button></div>` : `<div class="small">${ic("eye", "sm")} ${esc(prof(g.owner).name)}님이 공유한 목표예요. 보기만 할 수 있어요.</div>`}
  </article>`;
}

function renderGoals() {
  const f = S.goalFilter || "all";
  const pass = g => f === "all" || (f === "check" ? isCheck(g) : !isCheck(g) && goalPer(g) === f);
  const gs = goalList(), shown = gs.filter(pass);
  const mine = shown.filter(g => g.owner === S.me), theirs = shown.filter(g => g.owner === P()), both = shown.filter(g => g.owner === "both");
  const cnt = k => gs.filter(g => k === "all" || (k === "check" ? isCheck(g) : !isCheck(g) && goalPer(g) === k)).length;
  const sec = (title, list, empty) => `<h2 class="h2">${title} <span class="count">${list.length}</span></h2>
    ${list.length ? `<div class="grid-2">${list.map(goalCard).join("")}</div>` : `<div class="empty">${empty}</div>`}`;
  return `
    <div class="screen-head"><div><div class="eyebrow">습관과 목표</div><h1 class="big-date">꾸준히, 따로 또 같이</h1></div></div>
    <div class="chips" role="group" aria-label="목표 기간">
      ${[["all", "전체"], ["check", "✅ 매일 체크"], ["day", "일간"], ["week", "주간"], ["month", "월간"]].map(([k, l]) => `<button class="chip" data-act="gfilter" data-v="${k}" aria-pressed="${f === k}">${l} <small>${cnt(k)}</small></button>`).join("")}
    </div>
    ${sec(`${esc(prof(S.me).avatar)} 내 목표`, mine, "이 종류의 목표가 아직 없어요. 아래 <b>목표 추가</b>로 시작해 보세요.")}
    ${sec("💞 함께하는 목표", both, "둘이 함께할 목표를 만들어 보세요.")}
    ${sec(`${esc(prof(P()).avatar)} ${esc(prof(P()).name)}님의 목표`, theirs, `${esc(prof(P()).name)}님이 공유한 목표가 아직 없어요.`)}`;
}

function afterStart() {
  const L = S.login;
  if (L.step === "code" && CONFIGURED) {
    const ins = [0, 1, 2, 3].map(i => $("#c" + i));
    ins.forEach((el, i) => {
      el.addEventListener("input", () => {
        el.value = el.value.replace(/\D/g, "").slice(-1);
        L.code = ins.map(x => x.value).join("");
        if (el.value && i < 3) ins[i + 1].focus();
        if (L.code.length === 4) $('[data-act="code-next"]').focus();
      });
      el.addEventListener("keydown", e => { if (e.key === "Backspace" && !el.value && i > 0) ins[i - 1].focus(); if (e.key === "Enter") codeNext(); });
      el.addEventListener("paste", e => { const v = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4); if (v.length) { e.preventDefault(); v.split("").forEach((c, k) => (ins[k].value = c)); L.code = v; } });
    });
    (ins.find(x => !x.value) || ins[3]).focus();
  }
  if (L.step === "pin") {
    const p = $("#pin"); p.focus();
    p.addEventListener("keydown", e => e.key === "Enter" && pinGo());
    p.addEventListener("input", () => { p.value = p.value.replace(/\D/g, "").slice(0, 4); if (p.value.length === 4) pinGo(); });
  }
  if (L.step === "new") {
    $("#ava-pick").addEventListener("click", e => { const b = e.target.closest("[data-ava]"); if (!b) return; $("#ava-pick").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    $("#seed")?.addEventListener("click", e => { const s = e.currentTarget; s.setAttribute("aria-checked", s.getAttribute("aria-checked") !== "true"); });
    $("#new-form").addEventListener("submit", e => { e.preventDefault(); createSlot(); });
    $("#nm").focus();
  }
}

/* ========== 9. Firebase 로그인 흐름 ========== */
async function loadFirebase() {
  if (fb) return fb;
  const v = "10.12.2", u = m => `https://www.gstatic.com/firebasejs/${v}/firebase-${m}.js`;
  const [appM, authM, dbM] = await Promise.all([import(u("app")), import(u("auth")), import(u("database"))]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  fb = { ...dbM, app, auth: authM.getAuth(app), db: dbM.getDatabase(app), authM };
  return fb;
}
async function ensureAuth() {
  await loadFirebase();
  const user = await new Promise(res => { const off = fb.authM.onAuthStateChanged(fb.auth, u => { off(); res(u); }); });
  if (user) return user.uid;
  const cred = await fb.authM.signInAnonymously(fb.auth);
  return cred.user.uid;
}
const baseOf = code => `${ROOT}/couples/${code}`;

async function findMySlot(code, uid, slots) {
  for (const s of ["a", "b"]) {
    if (!slots[s]) continue;
    try { const d = await fb.get(fb.ref(fb.db, `${baseOf(code)}/devices/${s}/${uid}`)); if (d.exists()) return s; } catch {}
  }
  return null;
}

async function codeNext() {
  const L = S.login;
  if (!/^\d{4}$/.test(L.code)) { L.err = "숫자 4자리를 모두 입력해 주세요."; return render(); }
  L.err = "";
  try {
    const uid = await ensureAuth();
    const slots = (await fb.get(fb.ref(fb.db, `${baseOf(L.code)}/slots`))).val() || {};
    const mine = await findMySlot(L.code, uid, slots);
    if (mine) return startLive(L.code, mine, uid);
    L.slots = slots; L.step = "pick";
  } catch (e) { console.error(e); L.err = "연결하지 못했어요. 인터넷과 Firebase 설정(익명 로그인 사용)을 확인해 주세요."; }
  render();
}
async function codeNew() {
  const L = S.login; L.err = "";
  try {
    await ensureAuth();
    for (let i = 0; i < 20; i++) {
      const c = String(Math.floor(Math.random() * 10000)).padStart(4, "0");
      const s = (await fb.get(fb.ref(fb.db, `${baseOf(c)}/slots`))).val();
      if (!s) { L.code = c; L.slots = {}; L.step = "new"; return render(); }
    }
    L.err = "빈 코드를 찾지 못했어요. 다시 눌러 주세요.";
  } catch (e) { console.error(e); L.err = "연결하지 못했어요. Firebase 설정을 확인해 주세요."; }
  render();
}
let pinBusy = false;
async function pinGo() {
  const L = S.login, pin = $("#pin").value.trim();
  if (pinBusy) return;
  if (!/^\d{4}$/.test(pin)) { L.err = "숫자 4자리를 입력해 주세요."; return render(); }
  pinBusy = true;
  const btn = $('[data-act="pin-go"]'); if (btn) { btn.disabled = true; btn.textContent = "확인하는 중…"; }
  try {
    const uid = await ensureAuth();
    await fb.set(fb.ref(fb.db, `${baseOf(L.code)}/devices/${L.slot}/${uid}`), pin);
    pinBusy = false;
    startLive(L.code, L.slot, uid);
  } catch (e) {
    pinBusy = false; console.warn(e);
    L.err = String(e?.code || e?.message || e).toLowerCase().includes("permission") ? "비밀번호가 맞지 않아요." : "연결하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요.";
    render();
  }
}
async function createSlot() {
  const L = S.login;
  const name = $("#nm").value.trim(), pin = $("#npin").value.trim();
  const avatar = $("#ava-pick [aria-pressed='true']")?.dataset.ava || (L.slots.a ? "🐻" : "🐹");
  const seed = $("#seed")?.getAttribute("aria-checked") === "true";
  if (!name) { L.err = "이름을 입력해 주세요."; return render(); }
  if (!/^\d{4}$/.test(pin)) { L.err = "비밀번호는 숫자 4자리예요."; return render(); }
  try {
    const uid = await ensureAuth();
    const cur = (await fb.get(fb.ref(fb.db, `${baseOf(L.code)}/slots`))).val() || {};
    const slot = !cur.a ? "a" : !cur.b ? "b" : null;
    if (!slot) { L.err = "이미 두 사람이 연결된 코드예요."; L.slots = cur; L.step = "pick"; return render(); }
    await fb.update(fb.ref(fb.db, baseOf(L.code)), {
      [`slots/${slot}`]: { name, avatar, joinedAt: Date.now() },
      [`pins/${slot}`]: pin,
      [`devices/${slot}/${uid}`]: pin
    });
    await startLive(L.code, slot, uid);
    if (seed) await save(() => store.update("", sampleData(slot, false)), "샘플 일정을 넣었어요.");
  } catch (e) { console.error(e); L.err = "만들지 못했어요. 다시 시도해 주세요."; render(); }
}
async function startLive(code, slot, uid) {
  S.mode = "live"; S.code = code; S.me = slot; S.uid = uid;
  lsSet("uh.code", code);
  store = makeFbStore(baseOf(code));
  subscribeAll(); render();
}

/* ========== 11. 시트(입력·상세) ========== */
let sheetCleanup = null;
function openSheet(title, html, mount) {
  const root = $("#sheet-root");
  root.innerHTML = `<div class="sheet-back" id="sb"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="sh-t">${title}</h2><button class="x" data-close aria-label="닫기">${ic("x")}</button></div>
    ${html}</div></div>`;
  const back = $("#sb");
  back.addEventListener("click", e => { if (e.target === back || e.target.closest("[data-close]")) closeSheet(); });
  const onKey = e => e.key === "Escape" && closeSheet();
  document.addEventListener("keydown", onKey);
  sheetCleanup = () => document.removeEventListener("keydown", onKey);
  document.body.style.overflow = "hidden";
  mount?.(back);
}
function closeSheet() { $("#sheet-root").innerHTML = ""; document.body.style.overflow = ""; sheetCleanup?.(); sheetCleanup = null; }

function bindSeg(root, sel) {
  root.querySelectorAll(sel).forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest("button[data-v]"); if (!b || b.disabled) return;
    g.querySelectorAll("button[data-v]").forEach(x => x.setAttribute("aria-pressed", x === b));
    g.dispatchEvent(new CustomEvent("change"));
  }));
}
const segVal = (root, sel) => root.querySelector(`${sel} [aria-pressed="true"]`)?.dataset.v;
function armDelete(btn, fn) {
  btn.addEventListener("click", () => {
    if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "한 번 더 누르면 삭제"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "삭제"; }, 3000); return; }
    fn();
  });
}

function reactBar(it) {
  const r = S.reactions[reactKey(it)] || {};
  return `<div class="field"><span class="lbl">반응 남기기</span><div class="react-bar" data-key="${esc(reactKey(it))}" data-title="${esc(it.title)}">
    ${REACTS.map(e => `<button type="button" data-react="${e}" aria-pressed="${r[S.me] === e}" aria-label="${e} 반응">${e}</button>`).join("")}</div>
    ${r[P()] ? `<span class="small">${esc(prof(P()).avatar)} ${esc(prof(P()).name)}님은 ${r[P()]} 반응을 남겼어요.</span>` : ""}</div>`;
}
function bindReact(root) {
  const bar = root.querySelector(".react-bar"); if (!bar) return;
  bar.addEventListener("click", async e => {
    const b = e.target.closest("[data-react]"); if (!b) return;
    const key = bar.dataset.key, emo = b.dataset.react, cur = S.reactions[key]?.[S.me];
    const next = cur === emo ? null : emo;
    bar.querySelectorAll("[data-react]").forEach(x => x.setAttribute("aria-pressed", x.dataset.react === next));
    if (await save(() => store.set(`reactions/${key}/${S.me}`, next)) && next) logAct(`${q(bar.dataset.title)}에 ${next} 반응을 남겼어요`);
  });
}
const repeatHTML = r => {

};

function eventSheet(it, presetDate) {

      const f = segVal(root, "#ev-rep");
      $("#ev-days", root).hidden = f !== "weekly"; $("#ev-until-f", root).hidden = f === "none";
      if (f === "weekly" && !$("#ev-days [aria-pressed='true']", root)) { const d = parseD($("#ev-date", root).value || todayStr()).getDay(); $(`#ev-days [data-d="${d}"]`, root).setAttribute("aria-pressed", "true"); }
    });
    $("#ev-days", root).addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (b) b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); });
    if (isNew) $("#ev-title", root).focus();
    $("#ev-form", root).addEventListener("submit", async e => {
      e.preventDefault();
      const scope = segVal(root, "#ev-scope") || "private";
      const freq = segVal(root, "#ev-rep") || "none";
      const data = {
        title: $("#ev-title", root).value.trim(), date: $("#ev-date", root).value, time: $("#ev-time", root).value,
        endTime: $("#ev-end", root).value, place: $("#ev-place", root).value.trim(), memo: $("#ev-memo", root).value.trim(),
        done: series ? false : !!it?.done, owner: it?.owner || S.me, createdAt: it?.createdAt || Date.now(), updatedAt: Date.now()
      };
      if (freq !== "none") {
        data.repeat = { freq, until: $("#ev-until", root).value || "" };
        if (freq === "weekly") data.repeat.days = [...root.querySelectorAll("#ev-days [aria-pressed='true']")].map(b => +b.dataset.d);
        if (freq === "weekly" && !data.repeat.days.length) return toast("반복할 요일을 하나 이상 골라 주세요.");
        if (data.repeat.until && data.repeat.until < data.date) return toast("반복 끝나는 날이 시작보다 빨라요.");
        if (it?.doneDates) data.doneDates = it.doneDates;
        if (it?.skip) data.skip = it.skip;
      }
      if (it?.review) data.review = it.review;
      if (it?.sample) data.sample = true;
      if (!data.title || !data.date) return;
      if (data.endTime && data.time && data.endTime < data.time) return toast("끝나는 시간이 시작보다 빨라요.");
      const id = it ? it.baseId || it.id : store.newId();
      const up = {};
      if (it) up[itemPath(it)] = null;
      if (scope === "private") up[`private/${S.me}/events/${id}`] = { ...data, owner: S.me };
      else up[`events/${id}`] = { ...data, type: scope };
      const ok = await save(() => store.update("", up), isNew ? "일정을 추가했어요." : "저장했어요.");
      if (ok) {
        if (scope !== "private") logAct(`${q(data.title)} ${scope === "together" ? "함께하는 " : ""}일정을 ${isNew || it.scope === "private" ? "추가했어요" : "수정했어요"}`);
        else if (it && it.scope !== "private") logAct(`${q(data.title)} 일정을 공유에서 뺐어요`);
        closeSheet(); if (isNew) S.sel = data.date;
      }
    });
    if (!isNew) {
      $("#ev-done", root).addEventListener("click", async () => { await toggleDone(it); closeSheet(); });
      $("#ev-skip", root)?.addEventListener("click", async () => { if (await save(() => store.set(`${itemPath(it)}/skip/${it.occ}`, true), `${fmtShort(it.occ)}만 뺐어요.`)) closeSheet(); });
      armDelete($("#ev-del", root), async () => {
        if (await save(() => store.remove(itemPath(it)), "삭제했어요.")) { if (it.scope !== "private") logAct(`${q(it.title)} 일정을 삭제했어요`); closeSheet(); }
      });
    }
  });
}

async function toggleDone(it) {
  if (!canEdit(it)) return;
  const path = itemPath(it);
  const ok = it.occ
    ? await save(() => store.set(`${path}/doneDates/${it.occ}`, it.done ? null : true), !it.done ? "완료했어요." : "완료를 취소했어요.")
    : await save(() => store.update(path, { done: !it.done }), !it.done ? "완료했어요." : "완료를 취소했어요.");
  if (ok && !it.done && it.scope !== "private") logAct(`${q(it.title)} 일정을 ${it.scope === "together" ? "함께 " : ""}완료했어요`);
}

function planSheet(id, preset = {}) {
  const p = id ? S.plans[id] : null, isNew = !p;

  const past = p && p.status === "confirmed" && p.date && p.date <= todayStr();
  openSheet(isNew ? "함께할 계획 제안" : past ? "함께한 기록" : "계획 수정", `
    <form class="form" id="pl-form">
      ${past ? `<div class="field"><label for="pl-review">한 줄 후기</label><textarea class="input" id="pl-review" maxlength="120" placeholder="어땠는지 짧게 남겨 보세요">${esc(p.review)}</textarea></div>` : ""}
      <div class="field"><span class="lbl">종류</span><div class="chips" id="pl-cat" style="flex-wrap:wrap">
        ${Object.entries(PLAN_CATS).map(([k, [e, n]]) => `<button type="button" class="chip" data-v="${k}" aria-pressed="${k === cat}">${e} ${n}</button>`).join("")}</div></div>
      <div class="field"><label for="pl-title">무엇을 할까요?</label><input class="input" id="pl-title" required maxlength="60" value="${esc(p?.title)}" placeholder="예: 토요일 브런치"></div>
      <div class="two">
        <div class="field"><label for="pl-date">날짜</label><input class="input" type="date" id="pl-date" required value="${p?.date || preset.date || addDays(todayStr(), 1)}"></div>
        <div class="field"><label for="pl-time">시간</label><input class="input" type="time" id="pl-time" value="${p?.time || preset.time || "19:00"}"></div>
      </div>
      <div class="field"><label for="pl-place">장소 (선택)</label><input class="input" id="pl-place" maxlength="40" value="${esc(p?.place)}"></div>
      <div class="field"><label for="pl-memo">메모 (선택)</label><textarea class="input" id="pl-memo" maxlength="300">${esc(p?.memo)}</textarea></div>
      ${p ? reactBar({ src: "plan", id, title: p.title }) : ""}
      ${p && p.status === "confirmed" && !past ? `<div class="note">${ic("info", "sm")}<span>날짜나 시간을 바꾸면 ${esc(prof(P()).name)}님이 다시 확인하도록 제안 상태로 돌아가요.</span></div>` : ""}
      <button class="btn both block" type="submit">${isNew ? `${esc(prof(P()).name)}님에게 제안하기` : p.status === "declined" ? "다시 제안하기" : "저장하기"}</button>
      ${isNew ? "" : `<button class="btn danger block" type="button" id="pl-del">삭제</button>`}
    </form>`, root => {
    bindSeg(root, "#pl-cat"); bindReact(root);
    $("#pl-form", root).addEventListener("submit", async e => {
      e.preventDefault();
      const d = { cat: segVal(root, "#pl-cat") || "etc", title: $("#pl-title", root).value.trim(), date: $("#pl-date", root).value, time: $("#pl-time", root).value, place: $("#pl-place", root).value.trim(), memo: $("#pl-memo", root).value.trim() };
      if (past) d.review = $("#pl-review", root).value.trim();
      if (!d.title) return;
      let up, act;
      if (isNew) { up = { ...d, proposer: S.me, status: "proposed", done: false, createdAt: Date.now() }; act = `${q(d.title)} 계획을 제안했어요`; }
      else {
        const moved = d.date !== p.date || d.time !== p.time;
        up = { ...p, ...d, updatedAt: Date.now() };
        if (p.status === "declined" || (moved && p.status === "confirmed" && !past)) { up.status = "proposed"; up.proposer = S.me; act = `${q(d.title)} 계획을 ${fmtShort(d.date)} ${fmtTimeKo(d.time)}에 하자고 다시 제안했어요`; }
        else if (past && d.review && d.review !== p.review) act = `${q(d.title)}에 후기를 남겼어요: “${d.review}”`;
        else act = `${q(d.title)} 계획을 수정했어요`;
      }
      if (await save(() => store.set(`plans/${id || store.newId()}`, up), isNew ? "제안을 보냈어요." : "저장했어요.")) { logAct(act); closeSheet(); }
    });
    if (!isNew) armDelete($("#pl-del", root), async () => { if (await save(() => store.remove(`plans/${id}`), "삭제했어요.")) { logAct(`${q(p.title)} 계획을 삭제했어요`); closeSheet(); } });
  });
}

function logSheet(g, presetDate) {
  const unit = g.unit || "";
  const quick = { km: [3, 5, 7, 10], 분: [10, 20, 30, 60], 쪽: [10, 20, 30, 50], 회: [1] }[unit] || [1, 5, 10];
  const lp = goalLogPath(g);
  let shown = 20;
  const rows = () => Object.entries(g.logs || {}).filter(([, l]) => l && l.date).sort((a, b) => b[1].date.localeCompare(a[1].date) || (b[1].at || 0) - (a[1].at || 0));
  const rowHTML = ([lid, l]) => `<div class="log-row" data-lid="${lid}">
      <div class="log-view"><span class="log-d">${fmtShort(l.date)}</span><b>${l.value}${esc(unit)}</b>${g.owner === "both" ? `<span class="small">${esc(prof(l.by).avatar)} ${esc(prof(l.by).name)}</span>` : ""}
        ${g.owner !== "both" || l.by === S.me ? `<span class="log-btns"><button type="button" class="btn ghost sm" data-edit="${lid}">${ic("edit", "sm")}수정</button></span>` : ""}</div>
      <div class="log-edit" hidden>
        <input class="input" type="date" value="${l.date}" max="${todayStr()}" aria-label="날짜">
        <input class="input" type="number" inputmode="decimal" min="0" step="0.1" value="${l.value}" aria-label="기록 (${esc(unit)})">
        <div class="actions"><button type="button" class="btn primary sm" data-save="${lid}">저장</button><button type="button" class="btn danger sm" data-del="${lid}">삭제</button><button type="button" class="btn ghost sm" data-cancel="${lid}">취소</button></div>
      </div></div>`;
  const listHTML = () => { const r = rows(); return r.length ? r.slice(0, shown).map(rowHTML).join("") + (r.length > shown ? `<button type="button" class="btn ghost sm block" id="lg-more">이전 기록 더 보기 (${r.length - shown}개)</button>` : "") : `<div class="empty">아직 기록이 없어요.</div>`; };
  openSheet(`${esc(g.title)} 기록`, `
    <form class="form" id="lg-form">
      <div class="two">
        <div class="field"><label for="lg-val">기록 (${esc(unit) || "값"})</label><input class="input" id="lg-val" type="number" inputmode="decimal" min="0" step="0.1" required style="font-size:22px;font-weight:700"></div>
        <div class="field"><label for="lg-date">날짜</label><input class="input" id="lg-date" type="date" value="${presetDate || todayStr()}" max="${todayStr()}" required></div>
      </div>
      <div class="quick">${quick.map(x => `<button type="button" class="chip" data-q="${x}">${x}${esc(unit)}</button>`).join("")}</div>
      <button class="btn primary block" type="submit">기록하기</button>
    </form>
    <div class="field" style="margin-top:18px"><span class="lbl">지난 기록 · 눌러서 수정</span><div class="log-list" id="lg-list">${listHTML()}</div></div>`, root => {
    const val = $("#lg-val", root); if (!presetDate) val.focus();
    root.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => (val.value = b.dataset.q)));
    const list = $("#lg-list", root);
    list.addEventListener("click", async e => {
      const t = e.target.closest("button"); if (!t) return;
      const row = t.closest(".log-row");
      if (t.id === "lg-more") { shown += 30; list.innerHTML = listHTML(); return; }
      if (t.dataset.edit) { list.querySelectorAll(".log-edit").forEach(x => (x.hidden = true)); list.querySelectorAll(".log-view").forEach(x => (x.hidden = false)); row.querySelector(".log-view").hidden = true; row.querySelector(".log-edit").hidden = false; return; }
      if (t.dataset.cancel) { row.querySelector(".log-view").hidden = false; row.querySelector(".log-edit").hidden = true; return; }
      if (t.dataset.del) {
        if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "한 번 더"; return; }
        if (await save(() => store.remove(`${lp}/${t.dataset.del}`), "기록을 지웠어요.")) { delete g.logs[t.dataset.del]; list.innerHTML = listHTML(); }
        return;
      }
