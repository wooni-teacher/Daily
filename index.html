        const [di, vi] = row.querySelectorAll(".log-edit input"), v = +vi.value;
        if (!di.value) return toast("날짜를 골라 주세요.");
        if (!(v > 0)) return toast("0보다 큰 값을 입력해 주세요.");
        const old = g.logs[t.dataset.save], nl = { ...old, date: di.value, value: v, editedAt: Date.now() };
        if (await save(() => store.set(`${lp}/${t.dataset.save}`, nl), "기록을 고쳤어요.")) {
          g.logs[t.dataset.save] = nl; list.innerHTML = listHTML();
          if (g.src === "shared") logAct(`${q(g.title)} ${fmtShort(di.value)} 기록을 ${v}${unit}(으)로 고쳤어요`);
        }
      }
    });
    $("#lg-form", root).addEventListener("submit", async e => {
      e.preventDefault();
      const v = +val.value; if (!(v > 0)) return toast("0보다 큰 값을 입력해 주세요.");
      const d = $("#lg-date", root).value;
      if (await save(() => store.set(`${lp}/${store.newId()}`, { date: d, value: v, by: S.me, at: Date.now() }), `${v}${unit} 기록했어요.`)) {
        if (g.src === "shared") logAct(`${q(g.title)}에 ${d === todayStr() ? "" : fmtShort(d) + " "}${v}${unit} 기록했어요`);
        closeSheet();
      }
    });
  });
}

/* 매일 체크: 지난 기록 달력에서 보고 고치기 */
function checkHistorySheet(g, month) {
  const m = month || monthStart(todayStr()), t = todayStr(), edit = canEditGoal(g);
  const fresh = () => goalList().find(x => x.id === g.id && x.src === g.src) || g;
  const gridHTML = () => {
    const G = fresh(), g0 = weekStart(m), g1 = addDays(weekStart(monthEnd(m)), 6), cells = [];
    let done = 0, total = 0;
    for (let d = g0; d <= g1; d = addDays(d, 1)) {
      const out = d < m || d > monthEnd(m), on = checkDays(G).includes(parseD(d).getDay()), c = checkState(G, d);
      if (!out && on && d <= t) { total++; if (c.full) done++; }
      cells.push(`<button type="button" class="ck-cell ${out ? "out" : ""} ${c.full ? "full" : c.half ? "half" : ""} ${on ? "" : "off"} ${d === t ? "today" : ""}" data-d="${d}" ${!edit || d > t || out ? "disabled" : ""} aria-pressed="${c.mine}" aria-label="${fmtDate(d)} ${c.full ? "완료" : c.half ? "한 사람 완료" : "미완료"}">${parseD(d).getDate()}</button>`);
    }
    return `<div class="ck-cal-head">${["월", "화", "수", "목", "금", "토", "일"].map(w => `<span>${w}</span>`).join("")}</div><div class="ck-cal">${cells.join("")}</div>
      <div class="progress-line" style="margin-top:10px"><span>${+m.slice(5, 7)}월 달성</span><span><b>${done}</b> / ${total}일</span></div>`;
  };
  const color = g.owner === "both" ? "var(--both)" : `var(--${g.owner})`;
  const prev = (() => { const x = parseD(m); x.setMonth(x.getMonth() - 1); return ds(x); })(), next = (() => { const x = parseD(m); x.setMonth(x.getMonth() + 1); return ds(x); })();
  openSheet(`${esc(g.title)} 지난 기록`, `
    <div class="month-nav" style="margin-top:0"><button class="arrow" id="ch-prev" aria-label="지난달">${ic("left")}</button><span class="mn-label">${parseD(m).getFullYear()}년 ${+m.slice(5, 7)}월</span>
      <button class="arrow" id="ch-next" aria-label="다음 달" ${next > t ? "disabled" : ""}>${ic("right")}</button></div>
    <div id="ch-grid" style="--fillc:${color}">${gridHTML()}</div>
    <p class="small">${edit ? "날짜를 누르면 체크하거나 취소해요." : "보기만 할 수 있어요."}${g.owner === "both" ? " 반만 채워진 날은 한 사람만 체크한 날이에요. 누르면 내 체크만 바뀌어요." : ""}</p>`, root => {
    $("#ch-prev", root).addEventListener("click", () => checkHistorySheet(g, prev));
    $("#ch-next", root).addEventListener("click", () => next <= t && checkHistorySheet(g, next));
    $("#ch-grid", root).addEventListener("click", async e => {
      const b = e.target.closest("[data-d]"); if (!b || b.disabled) return;
      await toggleCheck(fresh(), b.dataset.d);
      setTimeout(() => { const gr = $("#ch-grid", root); if (gr) gr.innerHTML = gridHTML(); }, 120);
    });
  });
}

      <button class="arrow" data-act="dmonth" data-v="1" aria-label="다음 달" ${canNext ? "" : "disabled"}>${ic("right")}</button></div>
    <div class="chips" role="group" aria-label="보기">
      ${[["all", "전체"], ["me", `${prof(S.me).avatar} 내 일기`], ["partner", `${prof(P()).avatar} ${prof(P()).name} 일기`], ["thanks", "💌 감사만"]].map(([k, l]) => `<button class="chip" data-act="dfilter" data-v="${k}" aria-pressed="${f === k}">${esc(l)}</button>`).join("")}
    </div>
    ${dates.length ? `<div class="diary-days">${dates.map(d => `
      <section class="diary-day"><div class="day-label ${d === t ? "today" : ""}">${fmtShort(d)}</div>
        ${(f === "thanks" ? [] : days[d] || []).map(e => `<button class="card diary-item" data-act="diary-open" data-key="${esc(e.key)}" data-by="${e.by}">
          <span class="di-top">${whoChip(e.by)}${e.mood ? `<span class="di-mood">${e.mood}</span>` : ""}${e.by === S.me ? (e.shared ? `<span class="tag">${ic("eye", "sm")}공유</span>` : `<span class="tag">${ic("lock", "sm")}나만</span>`) : ""}${reactChips({ src: "diary", id: e.key })}</span>
          <span class="di-text">${esc(e.text)}</span></button>`).join("")}
        ${(f === "all" || f === "thanks") && thanksDays[d] ? `<div class="th-pair">${["a", "b"].filter(s => thanksDays[d][s]).map(s => `<button class="th-row ${s === S.me ? "me" : "them"}" ${s === S.me ? `data-act="thanks" data-d="${d}"` : "disabled"}><span class="th-who">💌 ${esc(prof(s).avatar)} ${esc(prof(s).name)} → ${esc(prof(other(s)).name)}</span><span class="th-text">“${esc(thanksDays[d][s].text)}”</span></button>`).join("")}</div>` : ""}
      </section>`).join("")}</div>`
      : `<div class="card empty">이 달에는 아직 기록이 없어요. 아래 <b>일기 쓰기</b>로 시작해 보세요.</div>`}
    <p class="small">${esc(prof(P()).name)}님의 일기는 '보여주기'를 켠 것만 보여요. 감사는 늘 서로에게 보여요.</p>`;
}

function settingsSheet() {
  const me = prof(S.me), partner = S.slots[P()];
  const link = `${location.origin}${location.pathname}?code=${S.code}`;
  openSheet("설정", `<div class="form">
    <div class="field"><label for="st-name">내 이름</label><input class="input" id="st-name" maxlength="10" value="${esc(me.name)}"></div>
    <div class="field"><span class="lbl">내 아이콘</span><div class="emoji-pick" id="st-ava">${AVATARS.map(a => `<button type="button" data-ava="${a}" aria-pressed="${a === me.avatar}" aria-label="아이콘 ${a}">${a}</button>`).join("")}</div></div>
    <button class="btn primary block" id="st-save">프로필 저장</button>
    ${S.mode === "live" ? `
      <div class="card" style="background:var(--surface2);box-shadow:none">
        <div class="lbl small" style="font-weight:700">커플 코드</div>
        <div class="code-show">${esc(S.code)}</div>
        <p class="small" style="margin:0 0 10px">${partner ? `${esc(partner.avatar)} ${esc(partner.name)}님과 연결돼 있어요.` : "상대가 이 코드로 들어와 <b>새로 참여하기</b>를 누르면 연결돼요."}</p>
        <div class="field"><input class="input" id="st-link" readonly value="${esc(link)}" aria-label="초대 링크"></div>
        <button class="btn block" id="st-copy" style="margin-top:8px">${ic("copy")}초대 링크 복사</button>
      </div>` : ""}
    ${S.mode === "live" && VAPID_KEY ? notifySection() : ""}
    <button class="btn block" id="st-anniv">${ic("heart")}처음 만난 날·기념일 설정</button>
    <div class="field"><span class="lbl">샘플 데이터</span><div class="actions">
      <button class="btn" id="st-seed">샘플 넣기</button><button class="btn" id="st-unseed">샘플 지우기</button></div></div>
    ${S.mode === "live" && partner ? `<div class="field"><span class="lbl">상대 자리 다시 열기</span>
      <span class="small">상대가 휴대폰을 바꾸고 비밀번호를 잊었을 때 써요. 상대의 비공개 일정·목표는 보호를 위해 함께 지워져요. 공유된 일정은 남아요.</span>
      <button class="btn danger block" id="st-reset">${esc(partner.name)}님 자리 다시 열기</button></div>` : ""}
    ${S.mode === "live" ? `<button class="btn ghost block" id="st-out">이 기기에서 로그아웃</button>` : `<button class="btn ghost block" id="st-out">체험 끝내기</button>`}
  </div>`, root => {
    bindSeg(root, "#st-ava");
    $("#st-ava", root).addEventListener("click", e => { const b = e.target.closest("[data-ava]"); if (b) $("#st-ava", root).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    $("#st-save", root).addEventListener("click", async () => {
      const name = $("#st-name", root).value.trim(); if (!name) return toast("이름을 입력해 주세요.");
      const avatar = $("#st-ava [aria-pressed='true']", root)?.dataset.ava || me.avatar;
      if (await save(() => store.update(`slots/${S.me}`, { name, avatar }), "프로필을 저장했어요.")) closeSheet();
    });
    $("#st-copy", root)?.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(link); toast("초대 링크를 복사했어요."); }
      catch { const i = $("#st-link", root); i.focus(); i.select(); toast("링크를 길게 눌러 복사해 주세요."); }
    });
    bindNotify(root);
    $("#st-anniv", root).addEventListener("click", () => { closeSheet(); annivSheet(); });
    $("#st-seed", root).addEventListener("click", async () => { if (await save(() => store.update("", sampleData(S.me, S.mode === "demo")), "샘플을 넣었어요.")) closeSheet(); });
    $("#st-unseed", root).addEventListener("click", async () => { await removeSamples(); closeSheet(); });
    const rs = $("#st-reset", root);
    if (rs) armDelete(rs, async () => {
      const p = P();
      if (await save(() => store.update("", { [`slots/${p}`]: null, [`pins/${p}`]: null, [`devices/${p}`]: null, [`private/${p}`]: null }), "상대 자리를 다시 열었어요.")) closeSheet();
    });
    $("#st-out", root).addEventListener("click", async () => {
      if (S.mode === "live") { try { if (lsGet("uh.pushTid")) await disablePush(); await store.remove(`devices/${S.me}/${S.uid}`); await fb.authM.signOut(fb.auth); } catch {} lsSet("uh.code", null); }
      unsubs.forEach(u => u()); unsubs = [];
      Object.assign(S, { mode: null, slots: {}, events: {}, plans: {}, goals: {}, logs: {}, activity: {}, info: {}, anniv: {}, notes: {}, reactions: {}, diary: {}, thanks: {}, priv: { events: {}, goals: {}, logs: {}, diary: {} }, tab: "today", login: { step: "code", code: "", slots: {}, slot: null, err: "" } });
      closeSheet(); render();
    });
  });
}

/* ========== 휴대폰 알림 (Firebase Cloud Messaging) ========== */
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const NOTIFY_DEFAULT = { partner: true, before: true, check: true };
const myNotify = () => ({ ...NOTIFY_DEFAULT, ...(S.slots[S.me]?.notify || {}) });
function pushStatus() {
  if (S.mode !== "live") return { ok: false, msg: "체험 모드에서는 알림을 켤 수 없어요." };
  if (!VAPID_KEY) return { ok: false, msg: "알림 키(VAPID)가 아직 설정되지 않았어요. README의 알림 설정 1단계를 먼저 해 주세요." };
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window))
    return { ok: false, msg: isIOS() ? "아이폰은 사파리에서 홈 화면에 추가한 앱으로 열어야 알림을 켤 수 있어요. (iOS 16.4 이상)" : "이 브라우저는 알림을 지원하지 않아요. 크롬이나 삼성 인터넷으로 열어 주세요." };
  if (isIOS() && !isStandalone()) return { ok: false, msg: "아이폰은 공유 버튼 → 홈 화면에 추가 후, 홈 화면 아이콘으로 열어서 알림을 켜 주세요." };
  if (Notification.permission === "denied") return { ok: false, msg: "알림이 차단돼 있어요. 휴대폰 설정 → 알림에서 이 앱(또는 브라우저)의 알림을 허용해 주세요." };
  return { ok: true, on: Notification.permission === "granted" && !!lsGet("uh.pushToken") };
}
async function tokenId(token) {
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(token));
  return [...new Uint8Array(h)].slice(0, 12).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function enablePush() {
  const st = pushStatus(); if (!st.ok) return toast(st.msg);
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("알림이 허용되지 않았어요.");
  try {
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const mm = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
    if (!(await mm.isSupported())) return toast("이 브라우저는 알림을 지원하지 않아요.");
    const token = await mm.getToken(mm.getMessaging(fb.app), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) return toast("알림 등록에 실패했어요. 다시 눌러 주세요.");
    const tid = await tokenId(token);
    await store.set(`push/${S.me}/${tid}`, { token, at: Date.now(), device: isIOS() ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "컴퓨터" });
    lsSet("uh.pushToken", token); lsSet("uh.pushTid", tid);
    toast("이 기기에서 알림을 받아요. 🔔");
  } catch (e) { console.error(e); toast("알림을 켜지 못했어요. 앱을 새로고침한 뒤 다시 시도해 주세요."); }
}
async function disablePush() {
  const tid = lsGet("uh.pushTid");
  try {
    if (tid) await store.remove(`push/${S.me}/${tid}`);
    const mm = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
    await mm.deleteToken(mm.getMessaging(fb.app)).catch(() => {});
  } catch {}
  lsSet("uh.pushToken", null); lsSet("uh.pushTid", null);
  toast("이 기기의 알림을 껐어요.");
}
async function testPush() {
  if (Notification.permission !== "granted") return toast("먼저 알림을 켜 주세요.");
  const reg = await navigator.serviceWorker.ready;
  reg.showNotification("우리 하루 알림 테스트", { body: "이렇게 알림이 와요 🐹🐻", icon: "icons/icon-192.png", badge: "icons/icon-192.png" });
}
function notifySection() {
  const st = pushStatus(), n = myNotify();
  const sw = (k, t, d) => `<button type="button" class="switch" data-notify="${k}" role="switch" aria-checked="${!!n[k]}"><span class="t"><b>${t}</b><span>${d}</span></span><span class="knob"></span></button>`;
  return `<div class="field"><span class="lbl">휴대폰 알림</span>
    ${st.ok ? (st.on
      ? `<div class="note">${ic("bell", "sm")}<span>이 기기에서 알림을 받고 있어요. 알림은 보통 5~15분 안에 와요.</span></div>
         <div class="actions"><button class="btn" id="st-push-test">테스트 알림</button><button class="btn ghost" id="st-push-off">이 기기 알림 끄기</button></div>`
      : `<button class="btn both block" id="st-push-on">${ic("bell")}이 기기에서 알림 받기</button>`)
      : `<div class="note">${ic("info", "sm")}<span>${esc(st.msg)}</span></div>`}
    ${sw("partner", `${esc(prof(P()).name)}님 소식`, "일정·계획·한마디·반응을 바꾸면 알려줘요")}
    ${sw("before", "일정 시작 전", "내 일정과 함께하는 일정이 20분 안에 시작하면 알려줘요")}
    ${sw("check", "저녁 9시 체크 알림", "오늘 체크 안 한 목표가 있으면 알려줘요")}
  </div>`;
}
function bindNotify(root) {
  $("#st-push-on", root)?.addEventListener("click", async () => { await enablePush(); closeSheet(); settingsSheet(); });
  $("#st-push-off", root)?.addEventListener("click", async () => { await disablePush(); closeSheet(); settingsSheet(); });
  $("#st-push-test", root)?.addEventListener("click", testPush);
  root.querySelectorAll("[data-notify]").forEach(b => b.addEventListener("click", async () => {
    const on = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", on);
    await save(() => store.update(`slots/${S.me}/notify`, { [b.dataset.notify]: on }));
  }));
}

/* ========== 12. 이벤트 ========== */
let toastT;
function toast(msg) {
  const r = $("#toast-root"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => (r.innerHTML = ""), 2200);
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.closest("#sheet-root")) return;
  const { act, v, id, src } = b.dataset;
  switch (act) {
    case "tab": S.tab = v; window.scrollTo(0, 0); render(); break;
    case "view": S.view = v; render(); break;
    case "week": moveDate(+v); break;
    case "month": moveMonth(+v); break;
    case "sel": S.sel = v; render(); break;
    case "msel": S.sel = v; render(); $(".month-day")?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); break;
    case "filter": S.filter = v; render(); break;
    case "open": { const it = findItem(src, id); if (it) eventSheet(it); break; }
    case "done": { const it = findItem(src, id); if (it) toggleDone(it); break; }
    case "fab": S.tab === "diary" ? diarySheet() : S.tab === "plans" ? planSheet() : S.tab === "goals" ? goalSheet() : eventSheet(null, S.tab === "today" ? todayStr() : S.sel); break;
    case "new-event": eventSheet(null, b.dataset.date); break;
    case "new-plan": planSheet(null, { date: todayStr() }); break;
    case "plan-ok": if (await save(() => store.update(`plans/${id}`, { status: "confirmed", confirmedAt: Date.now() }), "계획을 확정했어요. 함께 일정에 들어갔어요.")) logAct(`${q(S.plans[id]?.title || "")} 계획을 확정했어요 💞`); break;
    case "plan-no": if (await save(() => store.update(`plans/${id}`, { status: "declined" }), "다음에 하기로 했어요.")) logAct(`${q(S.plans[id]?.title || "")} 계획은 다음에 하자고 했어요`); break;
    case "free": planSheet(null, { date: b.dataset.d, time: b.dataset.t }); break;
    case "seen": save(() => store.update(`slots/${S.me}`, { lastSeen: Date.now() })); break;
    case "note": noteSheet(); break;
    case "diary": diarySheet(); break;
    case "diary-open": { const x = diaryList().find(e => e.key === b.dataset.key); if (x) diaryRead(x); break; }
    case "thanks": thanksSheet(b.dataset.d); break;
    case "dfilter": S.diaryFilter = v; render(); break;
    case "dmonth": { const x = parseD(S.diaryMonth || monthStart(todayStr())); x.setMonth(x.getMonth() + +v); S.diaryMonth = ds(x); render(); break; }
    case "log-day": { const g = goalList().find(x => x.id === id && x.src === src); if (g) logSheet(g, b.dataset.d); break; }
    case "check-hist": { const g = goalList().find(x => x.id === id && x.src === src); if (g) checkHistorySheet(g); break; }
    case "anniv": annivSheet(); break;
    case "plan-edit": planSheet(id); break;
    case "goal-edit": { const g = goalList().find(x => x.id === id && x.src === src); if (g) goalSheet(g); break; }
    case "check": { const g = goalList().find(x => x.id === id && x.src === src); if (g) toggleCheck(g, b.dataset.d); break; }
    case "gfilter": S.goalFilter = v; render(); break;
    case "log": { const g = goalList().find(x => x.id === id && x.src === src); if (g) logSheet(g, b.dataset.d); break; }
    case "settings": settingsSheet(); break;
    case "swap-view": S.me = P(); subscribeAll(); toast(`${prof(S.me).name} 시점으로 바꿨어요.`); break;
    case "demo": startDemo(); break;
    case "code-next": codeNext(); break;
    case "code-new": codeNew(); break;
    case "pin-go": pinGo(); break;
    case "pick-slot": S.login.slot = v; S.login.step = "pin"; S.login.err = ""; render(); break;
    case "pick-new": S.login.step = "new"; S.login.err = ""; render(); break;
    case "login-pick": S.login.step = "pick"; S.login.err = ""; render(); break;
    case "login-back": Object.assign(S.login, { step: "code", code: "", err: "" }); render(); break;
  }
});

// 일정 화면: 좌우로 밀어서 날짜(하루 보기)·주(주간 보기) 이동
let touch0 = null;
document.addEventListener("touchstart", e => {
  if (S.tab !== "schedule" || !S.mode || $("#sheet-root").innerHTML || e.touches.length > 1) return (touch0 = null);
  if (!e.target.closest("#swipe, .week-nav, .month-nav")) return (touch0 = null);
  touch0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y, dt = Date.now() - touch0.t;
  touch0 = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || dt > 800) return;
  if (S.view === "month") moveMonth(dx < 0 ? 1 : -1);
  else { const step = S.view === "day" ? 1 : 7; moveDate(dx < 0 ? step : -step); }
  navigator.vibrate?.(8);
}, { passive: true });

// 홈 화면 앱(오프라인 대비) — GitHub Pages 같은 https 주소에서만 동작
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

// 1분마다 '다음 일정' 시간을 갱신
setInterval(() => { if (S.mode && S.tab === "today" && !$("#sheet-root").innerHTML) schedule(); }, 60000);

/* ========== 13. 시작 ========== */
(async function boot() {
  let qcode = null;
  try { qcode = new URLSearchParams(location.search).get("code"); } catch {}
  const saved = (qcode && /^\d{4}$/.test(qcode)) ? qcode : lsGet("uh.code");
  if (CONFIGURED && saved && /^\d{4}$/.test(saved)) {
    S.login.code = saved;
    render();
    try {
      const uid = await ensureAuth();
      const slots = (await fb.get(fb.ref(fb.db, `${baseOf(saved)}/slots`))).val() || {};
      const mine = await findMySlot(saved, uid, slots);
      if (mine) return startLive(saved, mine, uid);
    } catch (e) { console.warn(e); }
    render();
  } else if (!CONFIGURED) {
    startDemo();   // 설정 전에는 바로 체험 화면을 보여줌
  } else render();
})();
</script>
