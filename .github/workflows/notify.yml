name: 우리 하루 알림

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 1 * *"
  workflow_dispatch: {}

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notify
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notify/package-lock.json
      - run: npm ci --prefix notify --no-audit --no-fund
      - run: node notify/index.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: https://habit-81d3e-default-rtdb.asia-southeast1.firebasedatabase.app

  keepalive:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "uri-haru-bot"
          git config user.email "uri-haru-bot@users.noreply.github.com"
          git commit --allow-empty -m "알림 유지용 빈 커밋"
          git push
